<!DOCTYPE html>
<html lang="zh-CN" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="选择你的设备，一键下载《我的世界》Windows、Android、iOS 客户端，并可打开指定网页。" data-i18n-content="description">
<title data-i18n="title">下载 《我的世界》</title>
<link href="https://fonts.loli.net/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
    :root { --mc-green: #43af3a; }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }

    html, body { min-height: 100%; }

    body {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: #000;
        color: #fff;
        min-height: 100vh;
        min-height: 100dvh;
        overflow-x: hidden;
    }

    #particles {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: block;
    }

    .container {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        /* 上下留白：顶部避开语言按钮，底部避开页脚 */
        padding: 90px 20px calc(140px + env(safe-area-inset-bottom, 0px));
        text-align: center;
    }

    .lang-switch {
        position: absolute;
        top: calc(16px + env(safe-area-inset-top, 0px));
        right: 16px;
        z-index: 100;
    }

    .lang-switch button {
        background: #1a1a1a;
        border: 1px solid #333;
        color: #fff;
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        min-height: 36px;
        transition: border-color .2s, background .2s;
    }
    .lang-switch button:hover { background: #222; border-color: #555; }
    .lang-switch button:focus-visible {
        outline: 2px solid var(--mc-green);
        outline-offset: 2px;
    }

    .logo {
        width: 100px;
        margin-bottom: 15px;
        filter: drop-shadow(0 0 15px rgba(67, 175, 58, .7));
        animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-10px); }
    }

    h1 {
        font-family: 'Press Start 2P', cursive;
        font-size: 22px;
        color: var(--mc-green);
        text-shadow: 0 0 8px var(--mc-green);
        margin-bottom: 12px;
        line-height: 1.4;
    }

    .subtitle {
        font-size: 14px;
        color: #aaa;
        margin-bottom: 30px;
        line-height: 1.5;
    }

    .btn-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        width: 100%;
        max-width: 340px;
    }

    .download-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: linear-gradient(145deg, var(--mc-green), #2e8b23);
        color: #fff;
        padding: 16px 40px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        border: 2px solid var(--mc-green);
        box-shadow: 0 0 15px rgba(67, 175, 58, .5);
        cursor: pointer;
        font-family: inherit;
        width: 100%;
        transition: transform .15s ease, box-shadow .2s ease;
    }
    .download-btn:hover { box-shadow: 0 0 22px rgba(67, 175, 58, .75); }
    .download-btn:active { transform: scale(.97); }
    .download-btn:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 3px;
    }

    .open-web-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: transparent;
        color: var(--mc-green);
        padding: 14px 40px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        border: 2px solid var(--mc-green);
        cursor: pointer;
        font-family: inherit;
        width: 100%;
        transition: background .2s ease, color .2s ease, box-shadow .2s ease;
    }
    .open-web-btn:hover,
    .open-web-btn:active {
        background: var(--mc-green);
        color: #fff;
        box-shadow: 0 0 15px rgba(67, 175, 58, .5);
    }
    .open-web-btn:active { transform: scale(.97); }
    .open-web-btn:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 3px;
    }

    /* ---------- 弹窗 ---------- */
    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .85);
        z-index: 999;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        opacity: 0;
        visibility: hidden;           /* 关键：让内部链接退出 Tab 顺序 */
        pointer-events: none;
        transition: opacity .3s ease, visibility .3s ease;
    }
    .modal-overlay.active {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
    }

    .modal {
        background: #111;
        border: 2px solid var(--mc-green);
        border-radius: 12px;
        padding: 25px 20px;
        width: 100%;
        max-width: 340px;
        max-height: calc(100dvh - 40px);
        overflow-y: auto;
        transform: translateY(20px);
        transition: transform .3s ease;
    }
    .modal-overlay.active .modal { transform: translateY(0); }

    .modal h2 {
        font-family: 'Press Start 2P', cursive;
        font-size: 14px;
        color: var(--mc-green);
        margin-bottom: 20px;
        line-height: 1.5;
    }

    .version-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .version-item {
        display: flex;
        align-items: center;
        gap: 12px;
        background: #1a1a1a;
        padding: 14px;
        border-radius: 8px;
        text-decoration: none;
        color: #fff;
        border: 1px solid #333;
        transition: background .2s ease, border-color .2s ease;
        text-align: left;
    }
    .version-item:hover,
    .version-item:active { background: var(--mc-green); border-color: var(--mc-green); }
    .version-item:hover .version-text span,
    .version-item:active .version-text span { color: rgba(255, 255, 255, .85); }
    .version-item:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
    }

    .version-icon { font-size: 22px; line-height: 1; }
    .version-text { font-size: 14px; font-weight: 600; line-height: 1.4; }
    .version-text span {
        display: inline-block;
        font-size: 12px;
        font-weight: 400;
        color: #aaa;
        transition: color .2s ease;
    }

    /* ---------- 网址输入弹窗 ---------- */
    .web-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .web-input {
        width: 100%;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 6px;
        color: #fff;
        font-family: inherit;
        font-size: 16px;         /* ≥16px：避免 iOS Safari 聚焦时自动缩放页面 */
        padding: 12px 14px;
        outline: none;
        -webkit-user-select: text;
        user-select: text;
        transition: border-color .2s ease;
    }
    .web-input::placeholder { color: #555; }
    .web-input:focus {
        border-color: var(--mc-green);
        box-shadow: 0 0 8px rgba(67, 175, 58, .4);
    }

    .web-hint {
        font-size: 12px;
        color: #666;
        line-height: 1.5;
        text-align: left;
    }

    .web-error {
        font-size: 12px;
        color: #e74c3c;
        line-height: 1.4;
        display: none;
    }
    .web-error.show { display: block; }

    /* ---------- 提示条 ---------- */
    .toast {
        position: fixed;
        left: 50%;
        bottom: calc(96px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%) translateY(20px);
        background: #1a1a1a;
        border: 1px solid var(--mc-green);
        color: #fff;
        padding: 10px 18px;
        border-radius: 8px;
        font-size: 13px;
        line-height: 1.5;
        max-width: calc(100vw - 40px);
        text-align: center;
        z-index: 1200;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity .3s ease, transform .3s ease, visibility .3s ease;
    }
    .toast.show {
        opacity: 1;
        visibility: visible;
        transform: translateX(-50%) translateY(0);
    }

    .web-actions {
        display: flex;
        gap: 10px;
        margin-top: 6px;
    }

    .web-go-btn {
        flex: 1;
        background: linear-gradient(145deg, var(--mc-green), #2e8b23);
        color: #fff;
        border: 2px solid var(--mc-green);
        border-radius: 6px;
        padding: 12px 16px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        font-family: inherit;
        transition: box-shadow .2s ease;
    }
    .web-go-btn:hover { box-shadow: 0 0 15px rgba(67, 175, 58, .5); }
    .web-go-btn:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 3px;
    }
    .web-go-btn:disabled {
        opacity: .6;
        cursor: wait;
        box-shadow: none;
    }

    .close-btn {
        margin-top: 20px;
        width: 100%;
        background: transparent;
        border: 1px solid #444;
        color: #888;
        padding: 12px 20px;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
        font-family: inherit;
        transition: color .2s, border-color .2s;
    }
    .close-btn:hover { color: #ccc; border-color: #666; }
    .close-btn:focus-visible {
        outline: 2px solid var(--mc-green);
        outline-offset: 2px;
    }

    /* ---------- 页脚签名 ---------- */
    .footer-signature {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 18px 20px calc(16px + env(safe-area-inset-bottom, 0px));
        background: linear-gradient(to top,
            rgba(0, 0, 0, .9) 0%,
            rgba(0, 0, 0, .6) 60%,
            transparent 100%);
        pointer-events: none;
    }

    .signature-line {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
    }
    .signature-line::before,
    .signature-line::after {
        content: '';
        width: 40px;
        height: 1px;
        background: linear-gradient(to right, transparent, var(--mc-green), transparent);
        opacity: .6;
    }

    .signature-icon {
        font-size: 14px;
        color: var(--mc-green);
        animation: pulse-glow 2s ease-in-out infinite;
    }

    @keyframes pulse-glow {
        0%, 100% { opacity: .6; }
        50%      { opacity: 1; }
    }

    .signature-text {
        font-family: 'Press Start 2P', cursive;
        font-size: 9px;
        color: var(--mc-green);
        letter-spacing: 2px;
        text-shadow: 0 0 6px rgba(67, 175, 58, .6);
    }

    .signature-sub {
        font-size: 11px;
        color: #555;
        letter-spacing: 1px;
    }

    .disclaimer {
        display: block;
        margin-top: 4px;
        font-size: 10px;
        color: #444;
        letter-spacing: .5px;
    }

    /* ---------- 响应式 ---------- */
    @media (min-width: 768px) {
        .logo { width: 130px; }
        h1 { font-size: 28px; }
        .subtitle { font-size: 16px; }
        .signature-line::before,
        .signature-line::after { width: 80px; }
        .signature-text { font-size: 11px; }
        .btn-group { max-width: 380px; }
    }

    /* 横屏 / 矮屏：内容改为顶对齐，避免被裁切 */
    @media (max-height: 620px) {
        .container {
            justify-content: flex-start;
            padding-top: 70px;
        }
        .logo { width: 70px; margin-bottom: 10px; }
        h1 { font-size: 18px; }
        .subtitle { margin-bottom: 18px; }
    }

    /* ---------- 无障碍：减少动效 ---------- */
    @media (prefers-reduced-motion: reduce) {
        .logo,
        .signature-icon { animation: none; }
        .modal,
        .modal-overlay,
        .download-btn,
        .open-web-btn,
        .version-item,
        .toast { transition: none; }
    }
</style>
</head>
<body>

<canvas id="particles" aria-hidden="true"></canvas>

<main class="container">
    <div class="lang-switch">
        <button type="button" onclick="toggleLang()" id="langBtn">English</button>
    </div>

    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M4 4H20V20H4V4Z" fill="#6B8F3B"/>
        <path d="M4 4H20V12H4V4Z" fill="#8BC34A"/>
        <path d="M4 12H20V20H4V12Z" fill="#558B2F"/>
        <rect x="4" y="4" width="16" height="16" stroke="#4B772D" stroke-width="2"/>
    </svg>

    <h1 data-i18n="mainTitle">MINECRAFT</h1>
    <p class="subtitle" data-i18n="subtitle">开启你的方块世界冒险</p>

    <div class="btn-group">
        <button type="button" class="download-btn" id="downloadBtn" onclick="openModal()">
            <span aria-hidden="true">📦</span>
            <span data-i18n="selectVersion">选择版本下载</span>
        </button>

        <button type="button" class="open-web-btn" id="openWebBtn" onclick="openWebModal()">
            <span aria-hidden="true">🌐</span>
            <span data-i18n="openWeb">打开指定网页</span>
        </button>
    </div>
</main>

<div class="footer-signature">
    <div class="signature-line">
        <span class="signature-icon" aria-hidden="true">⬢</span>
        <span class="signature-text" data-i18n="sigText">CRAFTED WITH LOVE</span>
        <span class="signature-icon" aria-hidden="true">⬢</span>
    </div>
    <div class="signature-sub">
        <span data-i18n="sigSub">© 2026 我的世界下载中心</span>
        <span class="disclaimer" data-i18n="disclaimer">非官方页面，与 Mojang / Microsoft 无关</span>
    </div>
</div>

<div class="modal-overlay" id="modal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <h2 id="modalTitle" data-i18n="modalTitle">选择下载版本</h2>

        <div class="version-list">
            <a class="version-item"
               href="https://mc.163.com/"
               target="_blank"
               rel="noopener noreferrer">
                <div class="version-icon" aria-hidden="true">🪟</div>
                <div class="version-text">
                    Windows / PC<br>
                    <span data-i18n="pcDesc">中国版客户端</span>
                </div>
            </a>

            <a class="version-item"
               href="https://mc.163.com/"
               target="_blank"
               rel="noopener noreferrer">
                <div class="version-icon" aria-hidden="true">🤖</div>
                <div class="version-text">
                    Android<br>
                    <span data-i18n="androidDesc">手机版 / 平板</span>
                </div>
            </a>

            <a class="version-item"
               href="https://apps.apple.com/cn/app/id1510445899"
               target="_blank"
               rel="noopener noreferrer">
                <div class="version-icon" aria-hidden="true">🍎</div>
                <div class="version-text">
                    iOS / iPadOS<br>
                    <span data-i18n="iosDesc">iPhone / iPad</span>
                </div>
            </a>
        </div>

        <button type="button" class="close-btn" onclick="closeModal()" data-i18n="cancel">取消</button>
    </div>
</div>

<div class="modal-overlay" id="webModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="webModalTitle">
        <h2 id="webModalTitle" data-i18n="webModalTitle">打开指定网页</h2>

        <div class="web-form">
            <input type="text"
                   class="web-input"
                   id="webUrlInput"
                   inputmode="url"
                   autocomplete="off"
                   spellcheck="false"
                   placeholder="example.com"
                   data-i18n-placeholder="webPlaceholder">

            <div class="web-hint" data-i18n="webHint">自动补全 https://www. 后打开，输入 163.com 即可</div>

            <div class="web-error" id="webError" role="alert" data-i18n="webError">请输入有效网址</div>

            <div class="web-actions">
                <button type="button" class="web-go-btn" id="webGoBtn" onclick="goWeb()" data-i18n="webGo">打开</button>
                <button type="button" class="close-btn" style="margin-top:0; flex:1;" onclick="closeWebModal()" data-i18n="cancel">取消</button>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="webToast" role="status" aria-live="polite"></div>

<script>
/* ==================== 国际化 ==================== */
const translations = {
    zh: {
        title: "下载 《我的世界》",
        description: "选择你的设备，一键下载《我的世界》Windows、Android、iOS 客户端，并可打开指定网页。",
        mainTitle: "MINECRAFT",
        subtitle: "开启你的方块世界冒险",
        selectVersion: "选择版本下载",
        openWeb: "打开指定网页",
        modalTitle: "选择下载版本",
        webModalTitle: "打开指定网页",
        webPlaceholder: "请输入网址，如 163.com",
        webHint: "自动补全 https://www. 后打开，输入 163.com 即可",
        webError: "请输入有效网址",
        webGo: "打开",
        webBlocked: "新标签页被浏览器拦截，请允许本站弹出窗口后重试",
        toastOpen: "已尝试打开 {url}。若提示无法访问此网址，可能是网络限制，请科学上网后重试",
        pcDesc: "中国版客户端",
        androidDesc: "手机版 / 平板（中国版）",
        iosDesc: "iPhone / iPad（国际版）",
        cancel: "取消",
        sigText: "用爱打造",
        sigSub: "© 2026 我的世界下载中心",
        disclaimer: "非官方页面，与 Mojang / Microsoft 无关"
    },
    en: {
        title: "Download Minecraft",
        description: "Choose your device, download Minecraft for Windows, Android, and iOS, and open any website.",
        mainTitle: "MINECRAFT",
        subtitle: "Start your block world adventure",
        selectVersion: "Select Version",
        openWeb: "Open a Website",
        modalTitle: "Choose Download Version",
        webModalTitle: "Open a Website",
        webPlaceholder: "Enter URL, e.g. 163.com",
        webHint: "https://www. is added automatically, e.g. enter 163.com",
        webError: "Please enter a valid URL",
        webBlocked: "Popup blocked by browser. Please allow pop-ups for this site and retry.",
        webGo: "Open",
        toastOpen: "Attempting to open {url}. If the site is unreachable, it may be blocked. Please use a VPN and retry.",
        pcDesc: "China Edition Client",
        androidDesc: "Phone / Tablet (China)",
        iosDesc: "iPhone / iPad (International)",
        cancel: "Cancel",
        sigText: "CRAFTED WITH LOVE",
        sigSub: "© 2026 Minecraft Download Center",
        disclaimer: "Unofficial page, not affiliated with Mojang or Microsoft"
    }
};

const SUPPORTED = ['zh', 'en'];
const HTML_LANG = { zh: 'zh-CN', en: 'en' };

function readStoredLang() {
    try { return localStorage.getItem('lang'); } catch (e) { return null; }
}

function storeLang(lang) {
    try { localStorage.setItem('lang', lang); } catch (e) { /* 无痕模式忽略 */ }
}

function detectLang() {
    const stored = readStoredLang();
    if (SUPPORTED.indexOf(stored) !== -1) return stored;
    const nav = (navigator.language || 'zh').toLowerCase();
    return nav.indexOf('zh') === 0 ? 'zh' : 'en';
}

let currentLang = detectLang();

// 提前声明：applyLang 内引用 webError / currentWebErrorKey，
// 若声明在函数之后会形成 TDZ 依赖，一旦调用位置上移即崩溃
const webError = document.getElementById('webError');
let currentWebErrorKey = 'webError';

function applyLang(lang) {
    if (SUPPORTED.indexOf(lang) === -1) lang = 'zh';
    currentLang = lang;
    storeLang(lang);

    document.documentElement.lang = HTML_LANG[lang];

    const dict = translations[lang] || translations.zh;

    document.getElementById('langBtn').textContent = (lang === 'zh') ? 'English' : '中文';

    document.querySelectorAll('[data-i18n]').forEach(function (el) {
        const key = el.getAttribute('data-i18n');
        if (Object.prototype.hasOwnProperty.call(dict, key)) {
            el.textContent = dict[key];
        }
    });

    document.querySelectorAll('[data-i18n-placeholder]').forEach(function (el) {
        const key = el.getAttribute('data-i18n-placeholder');
        if (Object.prototype.hasOwnProperty.call(dict, key)) {
            el.placeholder = dict[key];
        }
    });

    document.querySelectorAll('[data-i18n-content]').forEach(function (el) {
        const key = el.getAttribute('data-i18n-content');
        if (Object.prototype.hasOwnProperty.call(dict, key)) {
            el.setAttribute('content', dict[key]);
        }
    });

    document.title = dict.title || document.title;

    // 弹窗内错误提示若正在显示，按当前错误键重渲染，避免被 [data-i18n] 循环重置
    if (webError.classList.contains('show')) {
        webError.textContent = dict[currentWebErrorKey] || '';
    }
}

function toggleLang() {
    applyLang(currentLang === 'zh' ? 'en' : 'zh');
}

applyLang(currentLang);

/* ==================== 下载版本弹窗 ==================== */
const modal = document.getElementById('modal');
const downloadBtn = document.getElementById('downloadBtn');
let modalLastFocused = null;
let webLastFocused = null;

// 滚动锁计数：多个弹窗可叠加锁定，全部关闭后才恢复滚动
let scrollLockCount = 0;
function lockScroll() {
    scrollLockCount++;
    document.body.style.overflow = 'hidden';
}
function unlockScroll() {
    scrollLockCount = Math.max(0, scrollLockCount - 1);
    if (scrollLockCount === 0) document.body.style.overflow = '';
}

function openModal() {
    modalLastFocused = document.activeElement;
    modal.classList.add('active');
    modal.setAttribute('aria-hidden', 'false');
    lockScroll();

    const firstItem = modal.querySelector('.version-item');
    if (firstItem) {
        requestAnimationFrame(function () { firstItem.focus(); });
    }
}

function closeModal() {
    modal.classList.remove('active');
    modal.setAttribute('aria-hidden', 'true');
    unlockScroll();

    if (modalLastFocused && typeof modalLastFocused.focus === 'function') {
        modalLastFocused.focus();
    } else {
        downloadBtn.focus();
    }
}

modal.addEventListener('click', function (e) {
    if (e.target === modal) closeModal();
});

/* ==================== 打开指定网页 ==================== */
const webModal = document.getElementById('webModal');
const webUrlInput = document.getElementById('webUrlInput');
const openWebBtn = document.getElementById('openWebBtn');
const webGoBtn = document.getElementById('webGoBtn');

function setWebError(key) {
    currentWebErrorKey = key;
    const dict = translations[currentLang] || translations.zh;
    webError.textContent = dict[key] || '';
    webError.classList.add('show');
}

function clearWebError() {
    currentWebErrorKey = 'webError';
    webError.classList.remove('show');
}

function openWebModal() {
    webLastFocused = document.activeElement;
    webUrlInput.value = '';
    clearWebError();
    webGoBtn.disabled = false;               // 重置上次打开遗留的禁用态
    webModal.classList.add('active');
    webModal.setAttribute('aria-hidden', 'false');
    lockScroll();
    requestAnimationFrame(function () { webUrlInput.focus(); });
}

function closeWebModal() {
    webModal.classList.remove('active');
    webModal.setAttribute('aria-hidden', 'true');
    unlockScroll();
    clearWebError();
    if (webLastFocused && typeof webLastFocused.focus === 'function') {
        webLastFocused.focus();
    } else {
        openWebBtn.focus();
    }
}

function parseUrl(raw) {
    let url = (raw || '').trim();
    if (!url) return null;

    // 去除多余空白字符
    url = url.replace(/\s+/g, '');

    // 协议相对地址（//example.com）按 https 处理，避免生成 https://// 无效地址
    if (url.indexOf('//') === 0) {
        url = 'https:' + url;
    }

    // 提取协议；未带协议时默认 https://
    let proto = '';
    const protoMatch = url.match(/^([a-zA-Z][a-zA-Z0-9+.-]*:\/\/)(.*)$/);
    if (protoMatch) {
        proto = protoMatch[1];
        url = protoMatch[2];
    } else {
        proto = 'https://';
    }

    // 仅允许 http/https，其余协议（ftp:// 等）直接判定无效
    if (proto.toLowerCase() !== 'http://' && proto.toLowerCase() !== 'https://') {
        return null;
    }

    // 分离主机名与路径/查询/锚点
    const cutIndex = url.search(/[/?#]/);
    let host = url;
    let path = '';
    if (cutIndex !== -1) {
        host = url.slice(0, cutIndex);
        path = url.slice(cutIndex);
    }

    // 分离端口；IPv6 字面量（[::1]:8080）优先处理
    let port = '';
    if (host.charAt(0) === '[') {
        const bracket = host.indexOf(']');
        if (bracket !== -1) {
            const rest = host.slice(bracket + 1);
            if (rest.charAt(0) === ':') {
                port = rest;
                host = host.slice(0, bracket + 1);
            }
        }
    } else {
        const portIndex = host.indexOf(':');
        if (portIndex !== -1) {
            port = host.slice(portIndex);
            host = host.slice(0, portIndex);
        }
    }

    // 拒绝 @ \ % 等 URL 语法字符：@ 会被 new URL() 当作 userinfo 截断主机名
    // （a中@evil.com 会被解析为 evil.com，显示 ≠ 实际），反斜杠在部分浏览器会被当作 /。
    // 纯 ASCII 分支虽会被下方 validHost 挡下，但 punycode 分支会绕过校验，必须统一提前拦截。
    if (/[@\\%]/.test(host)) return null;

    // 非 ASCII 域名（如 中文.com）：借用 URL 做 Punycode 转换（端口已单独拆出，安全）。
    // 注意不能用 encodeURI——% 会被下方 validHost 正则拒绝，中文域名会误判无效。
    if (/[^\x00-\x7F]/.test(host)) {
        try {
            host = new URL('http://' + host).hostname;   // 中文.com → xn--fiq228c.com
        } catch (e) {
            return null;
        }
    }

    // 主机名不能为空（拦截 https:// 与 https:///path 这类输入）
    if (!host) return null;

    // 端口必须是 1-65535 的纯数字；非法端口（如 :abc / :0 / 空冒号）直接拒绝
    if (port) {
        const portNum = port.slice(1);
        if (!/^\d+$/.test(portNum) || +portNum < 1 || +portNum > 65535) return null;
    }

    // 主机名有效性：IPv6 字面量放行；其余必须满足域名/IP 标签规则，
    // 拒绝 www. 这类以点结尾、空标签或含非法字符的主机名
    const isIpv6 = host.charAt(0) === '[' && host.charAt(host.length - 1) === ']' && host.indexOf(':') !== -1;
    // IPv4 每段严格 0-255，拒绝 999.999.999.999 这类伪 IP
    const isIp = /^(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}$/.test(host);
    const validHost = /^[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?)*$/.test(host);
    if (!isIpv6 && !isIp && !validHost) return null;
    // 纯数字点分串必须是合法 IPv4，避免 999.999.999.999 被当作域名放行
    if (/^\d+(\.\d+)+$/.test(host) && !isIp) return null;

    // localhost、单段主机名不强制加 www
    const isLocal = host === 'localhost' || host.indexOf('.') === -1;

    // 裸二级域名（如 163.com）：自动补 www 前缀打开。
    // 注意：仅识别单点裸域，example.co.uk 这类多点后缀不会补 www（可接受）。
    // 不再做"探测失败回退裸域"——no-cors 探测不可靠，误判会把用户从正常站点踢走，
    // 交给用户自行判断（P1）。
    const bareApex = !isIp && !isLocal && host.indexOf('www.') !== 0 && host.indexOf('.') === host.lastIndexOf('.');

    let finalHost = host;
    if (bareApex) {
        finalHost = 'www.' + host;
    }

    return {
        url: proto + finalHost + port + path,
        bareApex: bareApex,
        wwwUrl: bareApex ? proto + 'www.' + host + port + path : ''
    };
}

function goWeb() {
    const parts = parseUrl(webUrlInput.value);

    // 防连点：进入即禁用，成功 1.5s 后恢复，失败立即恢复
    webGoBtn.disabled = true;

    if (!parts || !parts.url) {
        webGoBtn.disabled = false;
        setWebError('webError');
        webUrlInput.focus();
        return;
    }

    clearWebError();

    // 用户已按 Esc / 点击遮罩取消（弹窗已关闭）则不继续，避免"关了弹窗还弹新标签页"
    if (!webModal.classList.contains('active')) {
        webGoBtn.disabled = false;
        return;
    }

    const initialUrl = parts.wwwUrl || parts.url;

    // 同步打开新标签页：window.open 必须在用户手势上下文内同步调用，
    // 任何异步等待都会丢失瞬时激活（transient activation），被 Safari/iOS 拦截。
    // 不能传 'noopener' 特性——规范保证带 noopener 时 window.open 返回 null，
    // 会永远误报"被拦截"且后续句柄操作失效。
    // 先开 about:blank 拿同源句柄 → 同步置 opener=null → 再导航到目标地址：
    // 目标页从加载起就看不到 window.opener，彻底消除 reverse tabnabbing 竞态窗口。
    const win = window.open('about:blank', '_blank');

    if (!win) {
        // 被浏览器拦截：保留弹窗并提示，用户允许弹窗后可直接重试
        setWebError('webBlocked');
        webGoBtn.disabled = false;
        return;
    }

    try { win.opener = null; } catch (e) { /* 个别浏览器拒绝赋值，忽略 */ }
    win.location.href = initialUrl;

    closeWebModal();

    const dict = translations[currentLang] || translations.zh;
    showToast(dict.toastOpen.replace('{url}', initialUrl));

    // 成功打开后 1.5s 恢复按钮，防止连点重复开标签页
    setTimeout(function () { webGoBtn.disabled = false; }, 1500);
}

// 回车提交；isComposing 时忽略（中文/日文输入法组词确认回车不触发送）
webUrlInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.isComposing) {
        e.preventDefault();
        goWeb();
    }
});

// 输入时即时清除错误提示
webUrlInput.addEventListener('input', function () {
    clearWebError();
});

webModal.addEventListener('click', function (e) {
    if (e.target === webModal) closeWebModal();
});

/* ==================== 键盘支持 ==================== */
document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (webModal.classList.contains('active')) {
        closeWebModal();
    } else if (modal.classList.contains('active')) {
        closeModal();
    }
});

/* 弹窗打开时把 Tab 焦点锁在弹窗内 */
function trapFocus(container) {
    container.addEventListener('keydown', function (e) {
        if (e.key !== 'Tab' || !container.classList.contains('active')) return;

        const focusables = container.querySelectorAll('a[href], button:not([disabled]), input:not([disabled])');
        if (!focusables.length) return;

        const first = focusables[0];
        const last = focusables[focusables.length - 1];

        if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first.focus();
        }
    });

    // 焦点若意外落到弹窗外（window.open、点击遮罩等），强制拉回弹窗内
    document.addEventListener('focusin', function (e) {
        if (!container.classList.contains('active')) return;
        if (container.contains(e.target)) return;

        const focusables = container.querySelectorAll('a[href], button:not([disabled]), input:not([disabled])');
        if (!focusables.length) return;
        focusables[0].focus();
    });
}
trapFocus(modal);
trapFocus(webModal);

/* ==================== 提示条 ==================== */
const webToast = document.getElementById('webToast');
let toastTimer = null;

function showToast(msg) {
    webToast.textContent = msg;
    webToast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
        webToast.classList.remove('show');
    }, 4000);
}

/* ==================== 粒子背景 ==================== */
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
let reduceMotion = motionQuery.matches;
let rafId = null;

let W = 0;
let H = 0;
const particles = [];

const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
const COUNT = isMobile ? 50 : 120;

class Particle {
    constructor() {
        this.x = Math.random() * W;
        this.y = Math.random() * H;
        this.s = Math.random() * 2 + 0.5;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = (Math.random() - 0.5) * 0.5;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > W) this.vx *= -1;
        if (this.y < 0 || this.y > H) this.vy *= -1;
    }
    draw() {
        ctx.fillStyle = '#43af3a';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.s, 0, Math.PI * 2);
        ctx.fill();
    }
}

function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    // 用 setTransform 代替 ctx.scale，多次 resize 不会累积
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // 把越界粒子拉回可视区域
    for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        if (p.x > W) p.x = Math.random() * W;
        if (p.y > H) p.y = Math.random() * H;
    }
}

function initParticles() {
    if (reduceMotion) return;
    for (let i = 0; i < COUNT; i++) particles.push(new Particle());
}

function animate() {
    ctx.clearRect(0, 0, W, H);
    for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();
    }
    rafId = requestAnimationFrame(animate);
}

resize();
initParticles();
if (particles.length) animate();

// 用户中途切换"减少动态效果"系统设置时实时响应
if (motionQuery.addEventListener) {
    motionQuery.addEventListener('change', function (e) {
        reduceMotion = e.matches;
        if (reduceMotion) {
            cancelAnimationFrame(rafId);
            rafId = null;
            particles.length = 0;
            ctx.clearRect(0, 0, W, H);
        } else {
            initParticles();
            if (particles.length) animate();
        }
    });
}

let resizeTimer = null;
window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 100);
});

window.addEventListener('orientationchange', function () {
    setTimeout(resize, 200);
});
</script>
